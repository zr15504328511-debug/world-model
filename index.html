<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Model · 白模场景库</title><meta name="description" content="可在浏览器中探索和操作的三维白模场景集合。"><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f1;color:#222528;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:0 auto;padding:70px 28px}header{margin-bottom:44px}header p{color:#686d72;font-size:15px;margin:12px 0 0}h1{font-size:42px;font-weight:500;letter-spacing:-1px;margin:0}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}.model{max-width:720px;background:#fff;border:1px solid #dce0df;border-radius:8px;overflow:hidden}.image-link{display:block;background:#343434;aspect-ratio:16/9}.image-link img{display:block;width:100%;height:100%;object-fit:cover}.info{padding:26px}.info h2{font-size:24px;font-weight:500;margin:0 0 12px}.info p{line-height:1.65;margin:8px 0;color:#5b6267;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:24px}.open{padding:11px 18px;background:#24282b;color:#fff;border-radius:4px;text-decoration:none;font-size:14px}.frame{color:#5d6469;font-size:14px;text-underline-offset:3px}footer{margin-top:38px;font-size:12px;color:#7a8084}a:focus-visible{outline:2px solid #555;outline-offset:4px}.error{color:#a12424}@media(max-width:600px){main{padding:36px 18px}h1{font-size:34px}.info{padding:20px}header{margin-bottom:28px}}
</style></head><body><main><header><h1>World Model</h1><p>可探索、可操作的三维白模场景库</p></header><div class="models" id="models" aria-live="polite"></div><footer>首帧为生命科学风格概念图；进入场景后可操作灰阶白模。</footer></main><script>
fetch('./models.json').then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(models=>{const list=document.getElementById('models');for(const item of models){const card=document.createElement('article');card.className='model';const imageLink=document.createElement('a');imageLink.className='image-link';imageLink.href=item.path;imageLink.setAttribute('aria-label','进入 '+item.title);const image=document.createElement('img');image.src=item.preview;image.alt=item.title+' 生命科学风格首帧';imageLink.append(image);const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.description;const detail=document.createElement('p');detail.textContent=item.detail;const actions=document.createElement('div');actions.className='actions';const open=document.createElement('a');open.className='open';open.href=item.path;open.textContent='打开白模';const frame=document.createElement('a');frame.className='frame';frame.href=item.frame;frame.textContent='查看首帧';actions.append(open,frame);info.append(h,p,detail,actions);card.append(imageLink,info);list.append(card);}}).catch(()=>{const p=document.createElement('p');p.className='error';p.textContent='场景目录加载失败，请刷新页面。';document.getElementById('models').append(p);});
</script></body></html>
